# Dependabot — version updates + security updates for every ecosystem in the repo.
# Security updates for alerts are enabled implicitly once this file exists and
# alerts are on; the schedules below also keep regular deps fresh.
version: 2
updates:
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    groups:
      # One PR for all minor/patch bumps — keeps CI runs and review load low.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /frontend/android
    schedule:
      interval: weekly
