name: Deploy Flutter Web

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy_flutter_web.yml"
  workflow_dispatch:

# Serialize deploys per branch; never cancel an in-flight production deploy.
concurrency:
  group: deploy-flutter-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Flutter Web
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No RevenueCat keys on purpose: purchases_flutter has no web
      # implementation, so billing is disabled and premium content stays
      # locked on the web build (see PurchasesService._platformApiKey).
      - name: Build web release
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy
