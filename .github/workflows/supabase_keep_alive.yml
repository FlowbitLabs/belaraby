name: Supabase Keep-Alive

# Free-tier Supabase projects are paused after 7 days without API activity.
# This pings the REST API every 3 days so the project stays awake (the
# production GitHub environment carries the SUPABASE_URL / SUPABASE_ANON_KEY
# secrets).

on:
  schedule:
    - cron: "17 6 */3 * *" # every 3 days at 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Query one lesson row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl --silent --show-error --output /tmp/keep_alive_body \
            --write-out "%{http_code}" \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/lessons?select=id&limit=1")
          echo "HTTP $status"
          cat /tmp/keep_alive_body
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase keep-alive ping failed with HTTP $status" >&2
            exit 1
          fi
