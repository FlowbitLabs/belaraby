name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/functions/**"
      - ".github/workflows/deploy_supabase_migration.yml"
  workflow_dispatch:

# Serialize Supabase deploys per branch (db push + config push + functions
# deploy must never interleave); never cancel a deploy in flight.
concurrency:
  group: deploy-supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Supabase (${{ github.ref_name }})
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      # db push authenticates with the database directly; the CLI's
      # passwordless login-role flow is rejected by this project.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          # Pinned to the version config.toml is authored against. A newer
          # CLI knows newer config sections whose defaults then get pushed
          # (e.g. paid-tier vector buckets -> HTTP 402). Bump deliberately,
          # together with the local CLI and a config push dry-check.
          version: 2.72.7

      - name: Link Supabase project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID

      - name: Push new migrations
        run: supabase db push

      # config.toml carries local-dev auth URLs (127.0.0.1). Pushing those to
      # the hosted project would break auth emails / redirect allow-lists, so
      # substitute the environment's real public URL first — and fail loudly
      # when it is not configured instead of clobbering the remote settings.
      - name: Set environment auth URLs (never push localhost)
        env:
          AUTH_SITE_URL: ${{ vars.AUTH_SITE_URL }}
          AUTH_APP_URL: ${{ vars.AUTH_APP_URL }}
        run: |
          if [ -z "$AUTH_SITE_URL" ]; then
            echo "::error::AUTH_SITE_URL is not set on this GitHub environment. Set it (Settings → Environments → production → Variables) to the environment's public URL, e.g. the dashboard URL."
            exit 1
          fi
          sed -i "s|^site_url = .*|site_url = \"${AUTH_SITE_URL}\"|" supabase/config.toml
          # The Flutter web app origin must also be allow-listed: password
          # recovery links redirect back to it.
          REDIRECTS="\"${AUTH_SITE_URL}\""
          if [ -n "$AUTH_APP_URL" ]; then
            REDIRECTS="$REDIRECTS, \"${AUTH_APP_URL}\""
          fi
          sed -i "s|^additional_redirect_urls = .*|additional_redirect_urls = [${REDIRECTS}]|" supabase/config.toml
          grep -E "^(site_url|additional_redirect_urls) = " supabase/config.toml

      - name: Push project settings (config.toml is the source of truth)
        run: supabase config push --yes

      - name: Deploy edge functions
        run: supabase functions deploy --use-api
