name: belaraby
description: "An app for learning Arabic."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: 3.9.0
  flutter: 3.35.2

dependencies:
  carousel_slider: ^5.1.1
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_tts: ^4.2.3
  translator: ^1.0.0
  supabase_flutter: ^2.10.0

dev_dependencies:
  analyzer: ^8.2.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: 10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
