name: belaraby
description: "An app for learning Arabic."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: 3.9.0
  flutter: 3.35.2

dependencies:
  carousel_slider: ^5.1.1
  easy_localization: ^3.0.7
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_tts: ^4.2.3
  package_info_plus: ^9.0.1
  translator: ^1.0.0
  supabase_flutter: ^2.10.0
  purchases_flutter: ^10.2.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: 10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
