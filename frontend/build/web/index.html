<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Belaraby — Arabic stories, quizzes and grammar for learners.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Belaraby">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Belaraby — اكتشف بالعربي</title>
  <link rel="manifest" href="manifest.json">

  <!-- Branded splash shown while the Flutter engine loads (removed on the
       first rendered frame). -->
  <style>
    html, body { margin: 0; height: 100%; background: #1E3A5F; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      background: #1E3A5F; z-index: 9999;
      transition: opacity .3s ease-out;
    }
    #splash h1 {
      margin: 0; color: #fff; font-size: 28px; font-weight: 700;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #splash .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 5px solid rgba(255, 255, 255, .25);
      border-top-color: #F97316;
      animation: splash-spin .9s linear infinite;
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <h1 dir="rtl" lang="ar">اكتشف بالعربي</h1>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
